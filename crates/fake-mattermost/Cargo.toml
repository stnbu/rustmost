[package]
name = "fake-mattermost"
version = "0.1.0"
edition = "2024"
publish = false
description = "In-memory fake Mattermost server for testing rustmost"

[dependencies]
axum = { version = "0.8.9", features = ["multipart", "ws"] }
futures-util = "0.3.34"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
